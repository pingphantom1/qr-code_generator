{#
  faq-item.html
  Expects variable: faq (dict with keys "question" and "answer")
  Set faq before including: set faq = item
#}
<div class="faq-item" data-faq>
  <button
    class="faq-item__question"
    type="button"
    aria-expanded="false"
  >
    <span>{{ faq.question }}</span>
    <svg class="faq-item__chevron" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="6 9 12 15 18 9"/>
    </svg>
  </button>
  <div class="faq-item__answer" role="region" hidden>
    <p>{{ faq.answer }}</p>
  </div>
</div>
