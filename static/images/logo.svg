<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 52" fill="none" aria-label="PhantomQR logo">
  <!-- QR code icon -->
  <g>
    <!-- Outer border top-left finder pattern -->
    <rect x="2" y="2" width="20" height="20" rx="2" fill="currentColor"/>
    <rect x="5" y="5" width="14" height="14" rx="1" fill="white" class="logo-bg"/>
    <rect x="8" y="8" width="8" height="8" rx="0.5" fill="currentColor"/>

    <!-- Outer border top-right finder pattern -->
    <rect x="26" y="2" width="20" height="20" rx="2" fill="currentColor"/>
    <rect x="29" y="5" width="14" height="14" rx="1" fill="white" class="logo-bg"/>
    <rect x="32" y="8" width="8" height="8" rx="0.5" fill="currentColor"/>

    <!-- Outer border bottom-left finder pattern -->
    <rect x="2" y="26" width="20" height="20" rx="2" fill="currentColor"/>
    <rect x="5" y="29" width="14" height="14" rx="1" fill="white" class="logo-bg"/>
    <rect x="8" y="32" width="8" height="8" rx="0.5" fill="currentColor"/>

    <!-- Data modules (timing + data) -->
    <rect x="24" y="24" width="3" height="3" rx="0.4" fill="currentColor"/>
    <rect x="29" y="24" width="3" height="3" rx="0.4" fill="currentColor"/>
    <rect x="34" y="24" width="3" height="3" rx="0.4" fill="currentColor"/>
    <rect x="39" y="24" width="3" height="3" rx="0.4" fill="currentColor"/>
    <rect x="44" y="24" width="3" height="3" rx="0.4" fill="currentColor"/>

    <rect x="24" y="29" width="3" height="3" rx="0.4" fill="currentColor"/>
    <rect x="34" y="29" width="3" height="3" rx="0.4" fill="currentColor"/>
    <rect x="44" y="29" width="3" height="3" rx="0.4" fill="currentColor"/>

    <rect x="24" y="34" width="3" height="3" rx="0.4" fill="currentColor"/>
    <rect x="29" y="34" width="3" height="3" rx="0.4" fill="currentColor"/>
    <rect x="39" y="34" width="3" height="3" rx="0.4" fill="currentColor"/>
    <rect x="44" y="34" width="3" height="3" rx="0.4" fill="currentColor"/>

    <rect x="24" y="39" width="3" height="3" rx="0.4" fill="currentColor"/>
    <rect x="34" y="39" width="3" height="3" rx="0.4" fill="currentColor"/>
    <rect x="39" y="39" width="3" height="3" rx="0.4" fill="currentColor"/>

    <rect x="24" y="44" width="3" height="3" rx="0.4" fill="currentColor"/>
    <rect x="29" y="44" width="3" height="3" rx="0.4" fill="currentColor"/>
    <rect x="34" y="44" width="3" height="3" rx="0.4" fill="currentColor"/>
    <rect x="44" y="44" width="3" height="3" rx="0.4" fill="currentColor"/>

    <!-- Timing dots (vertical) -->
    <rect x="24" y="8" width="3" height="3" rx="0.4" fill="currentColor"/>
    <rect x="24" y="14" width="3" height="3" rx="0.4" fill="currentColor"/>
    <!-- Timing dots (horizontal) -->
    <rect x="8" y="24" width="3" height="3" rx="0.4" fill="currentColor"/>
    <rect x="14" y="24" width="3" height="3" rx="0.4" fill="currentColor"/>
  </g>

  <!-- "PhantomQR" text -->
  <text x="56" y="34" font-family="'Inter', 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="currentColor" letter-spacing="-0.5">PhantomQR</text>
</svg>
